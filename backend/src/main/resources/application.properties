spring.application.name=backend
spring.profiles.default=local

management.endpoints.web.base-path=/
management.endpoint.health.access=unrestricted
management.endpoint.health.show-details=never

# Single-operator dashboard login (E1-F3-S2) — see SecurityConfig.
dashboard.auth.username=${DASHBOARD_USERNAME:admin}
dashboard.auth.password=${DASHBOARD_PASSWORD:}
dashboard.auth.password-hash=${DASHBOARD_PASSWORD_HASH:}

server.servlet.session.cookie.same-site=Lax

# Watchlist signal-change notifications (E5-F4-S1) — the first background/
# scheduled job in this codebase (see notification.WatchlistSignalPoller).
# 15 minutes is a provisional default; local overrides it much shorter so
# manual verification doesn't need a long wait.
notification.watchlist-poll.enabled=true
notification.watchlist-poll.fixed-delay-ms=900000

# Minimum successful (filled, paper-mode) orders required before LIVE mode
# unlocks (E6-F1-S2) — see TradingModeService.switchTo.
trading-mode.paper-trade-threshold=${TRADING_MODE_PAPER_TRADE_THRESHOLD:10}

# Hard server-side caps on leverage and position size (E6-F2-S1) — enforced
# by RiskLimitService regardless of what the frontend sent. Position size is
# notional exposure (amountUsd * leverage); stock leverage is always 1x
# (OrderService.validate), so its notional equals the entered amount.
# Conservative starter defaults for a personal paper/testnet-scale account —
# raise via env var once the flow has proven itself.
risk-limits.stock-max-position-size-usd=${RISK_LIMITS_STOCK_MAX_POSITION_SIZE_USD:5000}
risk-limits.crypto-max-leverage=${RISK_LIMITS_CRYPTO_MAX_LEVERAGE:5}
risk-limits.crypto-max-position-size-usd=${RISK_LIMITS_CRYPTO_MAX_POSITION_SIZE_USD:2000}
# Portfolio-level cap (E6-F2-S3) on top of the per-order caps above — total
# notional across every currently-open order, in the same trading mode, plus
# the new order being submitted. Must be >= the largest per-order cap above
# (RiskLimitService fails fast at startup otherwise).
risk-limits.max-aggregate-exposure-usd=${RISK_LIMITS_MAX_AGGREGATE_EXPOSURE_USD:8000}
