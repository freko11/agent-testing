spring.application.name=backend
spring.profiles.default=local

management.endpoints.web.base-path=/
management.endpoint.health.access=unrestricted
management.endpoint.health.show-details=never

# Single-operator dashboard login (E1-F3-S2) — see SecurityConfig.
dashboard.auth.username=${DASHBOARD_USERNAME:admin}
dashboard.auth.password=${DASHBOARD_PASSWORD:}
dashboard.auth.password-hash=${DASHBOARD_PASSWORD_HASH:}

server.servlet.session.cookie.same-site=Lax
