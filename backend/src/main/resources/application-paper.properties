spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1522/XEPDB1}
spring.datasource.username=${DB_USERNAME:autotrade}
spring.datasource.password=${DB_PASSWORD:}

# Flyway is the single source of schema truth (E1-F2-S3); Hibernate only
# validates the mapped entities against what Flyway already created.
spring.jpa.hibernate.ddl-auto=validate

server.servlet.session.timeout=30m

# Market data (E2-F1-S1). Uses the real public Binance API (not testnet) for
# indicator accuracy — this intentionally diverges from E4/E5's Binance
# *testnet* trading prices; a paper trade will execute against a testnet
# fill even though the signal that triggered it was computed from real
# prices. Worth a doc note once E5's order-submission story is designed.
marketdata.alpaca.base-url=https://data.alpaca.markets
marketdata.alpaca.api-key=${ALPACA_API_KEY:}
marketdata.alpaca.api-secret=${ALPACA_API_SECRET:}
marketdata.binance.base-url=https://api.binance.com

# Alpaca trading adapter (E4-F2-S1). Base URLs only — credentials come from
# BrokerCredentialService (ALPACA_TRADING_API_KEY/SECRET bootstrap it once at
# startup, see AlpacaTradingCredentialBootstrap), not config.
broker.alpaca.paper-base-url=https://paper-api.alpaca.markets
broker.alpaca.live-base-url=https://api.alpaca.markets

# Binance Futures Testnet trading adapter (E4-F3-S1). Base URLs only —
# credentials come from BrokerCredentialService (BINANCE_TRADING_API_KEY/SECRET
# bootstrap it once at startup, see BinanceTradingCredentialBootstrap), not
# config. "paper" here means Binance's own USD(S)-M Futures Testnet, not Spot
# Testnet — chosen because E4-F3-S2's leveraged-order requirement needs real
# margin support Spot doesn't have.
broker.binance.paper-base-url=https://testnet.binancefuture.com
broker.binance.live-base-url=https://fapi.binance.com
