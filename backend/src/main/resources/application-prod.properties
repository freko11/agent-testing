# Future live-trading profile — not usable until E6's live-mode gate (paper-trade
# threshold + explicit consent) is implemented. No defaults on purpose: every value
# must come from the environment, so live mode can never start on placeholder config.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway is the single source of schema truth (E1-F2-S3); Hibernate only
# validates the mapped entities against what Flyway already created.
spring.jpa.hibernate.ddl-auto=validate

# Tighter than paper — consistent with prod's already-stricter no-fallback posture.
server.servlet.session.timeout=15m

# Market data (E2-F1-S1). No defaults on the credentials, matching this
# profile's no-placeholder-config posture; base URLs aren't sensitive so
# they're literal like every other profile.
marketdata.alpaca.base-url=https://data.alpaca.markets
marketdata.alpaca.api-key=${ALPACA_API_KEY}
marketdata.alpaca.api-secret=${ALPACA_API_SECRET}
marketdata.binance.base-url=https://api.binance.com

# Alpaca trading adapter (E4-F2-S1). Base URLs only — not sensitive, literal
# like every other profile; credentials come from BrokerCredentialService.
# LIVE mode isn't usable until E6's live-mode gate exists regardless of this
# base URL being configured.
broker.alpaca.paper-base-url=https://paper-api.alpaca.markets
broker.alpaca.live-base-url=https://api.alpaca.markets

# Binance Futures Testnet trading adapter (E4-F3-S1). Base URLs only — not
# sensitive, literal like every other profile; credentials come from
# BrokerCredentialService. LIVE mode isn't usable until E6's live-mode gate
# exists regardless of this base URL being configured.
broker.binance.paper-base-url=https://testnet.binancefuture.com
broker.binance.live-base-url=https://fapi.binance.com
