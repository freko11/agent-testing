spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway applies the real V1/V2 migrations (db/migration, on the main
# resources classpath) against H2's Oracle-compatibility mode at test
# startup; Hibernate only validates against what Flyway created.
spring.jpa.hibernate.ddl-auto=validate

# Deterministic single-operator login credential for SecurityConfigTest —
# avoids depending on SecurityConfig's private insecure dev-only fallback.
dashboard.auth.username=testuser
dashboard.auth.password=testpass1234

# Market data (E2-F1-S1) — base URLs must be set for the RestClient beans to
# construct at context startup; no API key/secret needed since no test hits
# these beans over real HTTP (client tests build their own RestClient
# directly against MockRestServiceServer instead).
marketdata.alpaca.base-url=https://data.alpaca.markets
marketdata.binance.base-url=https://api.binance.com

# Alpaca trading adapter (E4-F2-S1) — same reasoning: base URLs only needed
# for the RestClient beans to construct at context startup, no live HTTP hits
# them in tests. No ALPACA_TRADING_API_KEY/SECRET set, so
# AlpacaTradingCredentialBootstrap is a no-op in every @SpringBootTest.
broker.alpaca.paper-base-url=https://paper-api.alpaca.markets
broker.alpaca.live-base-url=https://api.alpaca.markets

# Watchlist signal-change poller (E5-F4-S1) — must never fire inside a
# @SpringBootTest (it would call real Alpaca/Binance market-data endpoints),
# per this codebase's "no live network calls in CI" discipline.
notification.watchlist-poll.enabled=false

# Live signal-drift monitoring (E8-F5-S1) — same "no live network calls in
# CI" discipline as notification.watchlist-poll.enabled above; disabled here
# skips LiveSignalDriftService/SignalDriftController's bean creation (both are
# @ConditionalOnProperty on this one flag) entirely for the default test run.
# Unlike notification.watchlist-poll.fixed-delay-ms (never overridden by any
# test), the other three keys below still get literal defaults here: a real
# @SpringBootTest (SignalDriftControllerIntegrationTest) deliberately
# re-enables this flag via @TestPropertySource to prove the real @Value-bound
# constructor/bean wiring works, not just the disabled path every other test
# exercises — and @Scheduled's fixed-delay-ms placeholder is resolved at bean
# post-processing time regardless of whether anything ever calls the
# @Scheduled method, so it needs a value here too, or that one test's context
# fails to load with an unresolved-placeholder error (caught by writing that
# test — see docs/CHANGELOG.md's E8-F5-S1 entry).
monitoring.live-drift.enabled=false
monitoring.live-drift.fixed-delay-ms=21600000
monitoring.live-drift.lookback-days=90
monitoring.live-drift.min-sample-size=20
monitoring.live-drift.decay-threshold-pct=0.5

# E8-F5-S3's weighted-vote shadow-scoring diagnostic -- same shadowing/@Scheduled-placeholder
# reasoning as monitoring.live-drift.* directly above, disabled here for the same "no unit test
# should ever make a real market-data call" reason.
monitoring.weighted-vote-shadow.enabled=false
monitoring.weighted-vote-shadow.fixed-delay-ms=21600000
monitoring.weighted-vote-shadow.lookback-days=90

# SystemAlertService's constructor reads this unconditionally via @Value, so every
# @SpringBootTest needs it resolved -- same shadowing gotcha as every other key here.
alert.signal-drift-decay.re-alert-cooldown-ms=86400000

# Paper-trade threshold gating LIVE mode (E6-F1-S2) — TradingModeService's
# constructor is unconditional, so every @SpringBootTest needs this resolved
# even when the test itself doesn't care about the value. TradingModeServiceTest
# overrides it to a smaller number via @TestPropertySource for fast, deterministic
# threshold tests.
trading-mode.paper-trade-threshold=10

# Hard server-side leverage/position-size caps (E6-F2-S1) — RiskLimitService's
# constructor is unconditional (and fail-fasts if crypto-max-leverage exceeds
# OrderService.MAX_CRYPTO_LEVERAGE), so every @SpringBootTest needs these
# resolved. Matches the literal (non-placeholder) defaults in main's
# application.properties.
risk-limits.stock-max-position-size-usd=5000
risk-limits.crypto-max-leverage=5
risk-limits.crypto-max-position-size-usd=2000
risk-limits.max-aggregate-exposure-usd=8000
