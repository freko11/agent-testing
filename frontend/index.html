<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Trade Dashboard</title>
    <script>
      // Set before first paint so the dark-first theme never flashes light on load —
      // ThemeProvider (theme/ThemeContext.tsx) takes over from here once React mounts.
      document.documentElement.dataset.theme = localStorage.getItem('autotrade-theme') === 'light' ? 'light' : 'dark'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
